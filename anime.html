<section class="viewer" aria-label="Episode player"><div class="viewer-heading"><h2 id="playingTitle">Episode 1</h2><a href="https://www.youtube.com/playlist?list=PLIdNQWPOND8Vg5-QvAhzEmFzR5wv67RWy" target="_blank" rel="noopener noreferrer">View playlist on YouTube ↗</a></div><div class="video-frame"><iframe id="animePlayer" title="Altered States Anime playlist player" src="https://www.youtube-nocookie.com/embed/videoseries?list=PLIdNQWPOND8Vg5-QvAhzEmFzR5wv67RWy&amp;index=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe></div><p class="note">Episodes follow the current YouTube playlist order. If a numbered button doesn't select the expected episode, use the playlist control inside the player.</p></section>
</main><script>
(function(){
  const playlist='PLIdNQWPOND8Vg5-QvAhzEmFzR5wv67RWy';
  const player=document.getElementById('animePlayer');
  const title=document.getElementById('playingTitle');
  const buttons=Array.from(document.querySelectorAll('[data-episode]'));
  buttons.forEach(button=>button.addEventListener('click',()=>{
    const number=Number(button.dataset.episode);
    if(!Number.isInteger(number)||number<1||number>20)return;
    buttons.forEach(b=>{const active=b===button;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
    title.textContent='Episode '+number;
    player.src='https://www.youtube-nocookie.com/embed/videoseries?list='+encodeURIComponent(playlist)+'&index='+(number-1);
  }));
})();
</script></body></html>
