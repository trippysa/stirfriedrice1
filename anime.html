</main><script>
(function () {
  const videoIds = ["HCN_qDSaQ5U", "08YckffvXXs", "Yvr6l4OqNeY", "-8qPF-qM83c", "x85ouPTsbLk", "hGFaD1LBt6Y", "s0BtRmDu3ts", "223JM2kCn2k", "AJ-QaRIn7RU", "lcoBWiwGmRY", "iDkT8X938OM", "eSwiurs0p9k", "lgPJaEWIBIY", "ZeIY_wIY7JA", "H1EhUwjgngE", "HSIHGC9LzSc", "5l6cYWnSClk", "6iiEX4B8L2A", "gyf_brLBdKI", "keAXJ1iAoF4"];
  const player = document.getElementById('animePlayer');
  const title = document.getElementById('playingTitle');
  const buttons = document.querySelectorAll('[data-episode]');
  buttons.forEach((button) => {
    button.addEventListener('click', () => {
      const number = Number(button.dataset.episode);
      const videoId = videoIds[number - 1];
      if (!videoId) return;
      buttons.forEach((b) => {
        const active = b === button;
        b.classList.toggle('active', active);
        b.setAttribute('aria-pressed', String(active));
      });
      title.textContent = 'Episode ' + number;
      player.src = 'https://www.youtube-nocookie.com/embed/' + videoId;
    });
  });
})();
</script></body></html>
