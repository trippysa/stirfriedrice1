</main><script>
(function () {
  const videoIds = ["f54TQuUQIiQ", "GjrvV-_ersg", "98Z-gOLO9-Q", "8K-9avxICBI", "Ji58z1d3RsY", "jXJVgQsUl7s", "i-u0uFW5ka0", "48eUZ3DtpJo", "f0UOSHMOcjI", "k0MUGmgve74"];
  const videoTitles = ['Uncontrollably', 'Blaze - Minecraft', 'A Regular Guy', 'Just a Monster', 'Let Me Out - Minecraft', 'Full Moon', 'Dangerous Love - Minecraft', 'The Real Monster', 'Strategic Planning Analyst', 'Raid the Bastion - Minecraft'];
  const player = document.getElementById('animePlayer');
  const title = document.getElementById('playingTitle');
  const buttons = document.querySelectorAll('[data-video]');
  buttons.forEach((button) => {
    button.addEventListener('click', () => {
      const number = Number(button.dataset.video);
      const videoId = videoIds[number - 1];
      if (!videoId) return;
      buttons.forEach((b) => {
        const active = b === button;
        b.classList.toggle('active', active);
        b.setAttribute('aria-pressed', String(active));
      });
      title.textContent = videoTitles[number - 1];
      player.src = 'https://www.youtube-nocookie.com/embed/' + videoId;
      document.getElementById('watchOnYouTube').href = 'https://www.youtube.com/watch?v=' + videoId;
    });
  });
})();
</script></body></html>
